[package]
name = "winit-scene-integration"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["staticlib"]

[dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
raw-window-handle = "0.6"
softbuffer = { version = "0.4.8", default-features = false }
winit = { git = "https://github.com/molenick/winit", rev = "ede8df77205f55a5fe32693bdb8dc4bb0441a45c" }
